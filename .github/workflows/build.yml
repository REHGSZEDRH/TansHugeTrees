# 放到你的 fork 的 .github/workflows/build.yml
name: Build Mod

on:
  push:
    branches: [ "1.20.1forge-LMaxFixAndImprove", "**" ]
  pull_request:
  workflow_dispatch:      # 允許在 Actions 分頁手動點 Run workflow

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # repo 預設 -Xmx1G，CI 上給大一點比較穩
      - name: Build
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4G
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: tanshugetrees-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30
